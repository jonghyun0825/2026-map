<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2026 여름캠프 자동차 동선</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css">
<style>
html,body{height:100%;margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:#f7f8fa;color:#202124}
.wrap{display:grid;grid-template-columns:370px 1fr;height:100%}
.sidebar{background:#fff;border-right:1px solid #d9dde3;padding:16px;overflow:auto}
h1{font-size:20px;margin:0 0 12px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:1px solid #cfd4da;background:#fff;border-radius:999px;padding:8px 12px;cursor:pointer}
.tab.active{background:#202124;color:#fff;border-color:#202124}
.stop-list{margin:0;padding-left:22px;font-size:13px;line-height:1.5}
.stop-list li{margin:7px 0}
.legend{margin-top:16px}
.legend-row{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px}
.swatch{width:26px;height:6px;border-radius:999px;flex:0 0 auto}
.dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto}
#map{height:100%;width:100%}
.num-pin{width:32px;height:32px;border-radius:50%;color:#fff;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:700;box-shadow:0 1px 5px rgba(0,0,0,.35)}
.leaflet-routing-container{display:none}
@media(max-width:800px){
  .wrap{grid-template-columns:1fr;grid-template-rows:auto 65vh}
  .sidebar{border-right:0;border-bottom:1px solid #d9dde3;max-height:35vh}
}
</style>
</head>
<body>
<div class="wrap">
  <aside class="sidebar">
    <h1>2026 여름캠프 자동차 동선</h1>
    <div class="tabs" id="tabs"></div>
    <ol class="stop-list" id="stopList"></ol>
    <div class="legend" id="segmentLegend"></div>
    <div class="legend">
      <div style="font-weight:700;font-size:13px;margin-bottom:6px">장소 구분</div>
      <div class="legend-row"><span class="dot" style="background:#263238"></span><span>출발/도착</span></div><div class="legend-row"><span class="dot" style="background:#F39C12"></span><span>식사</span></div><div class="legend-row"><span class="dot" style="background:#4A90E2"></span><span>교회/순례</span></div><div class="legend-row"><span class="dot" style="background:#5CB85C"></span><span>관광/체험</span></div><div class="legend-row"><span class="dot" style="background:#7F8C8D"></span><span>숙소</span></div><div class="legend-row"><span class="dot" style="background:#9B59B6"></span><span>프로그램</span></div>
    </div>
  </aside>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
<script>
const data = {"8/3 (월)": [{"name": "양산 증산역(출발 기준)", "time": "08:00", "lat": 35.3088, "lon": 129.0098, "category": "출발/도착"}, {"name": "바글바글 식당(광주 광산구)", "time": "11:30", "lat": 35.1597, "lon": 126.8105, "category": "식사"}, {"name": "소금박물관", "time": "13:00", "lat": 34.99632, "lon": 126.17552, "category": "관광/체험"}, {"name": "대초리교회 (지도증도로 1409)", "time": "14:00", "lat": 34.9788, "lon": 126.1638, "category": "교회/순례"}, {"name": "문준경전도사 순교기념관", "time": "15:00", "lat": 35.0108, "lon": 126.137, "category": "교회/순례"}, {"name": "증동리교회", "time": "16:30", "lat": 35.0113, "lon": 126.1363, "category": "교회/순례"}, {"name": "보물섬식당 (보물섬길 8)", "time": "18:00", "lat": 35.0022446, "lon": 126.132898, "category": "식사"}, {"name": "기도바위 입구(위치 추정)", "time": "19:00", "lat": 35.0165, "lon": 126.1365, "category": "프로그램"}, {"name": "에버리스 U&I 펜션", "time": "20:30", "lat": 34.9838, "lon": 126.1352, "category": "숙소"}], "8/4 (화)": [{"name": "에버리스 U&I 펜션", "time": "08:00", "lat": 34.9838, "lon": 126.1352, "category": "숙소"}, {"name": "임자진리교회", "time": "09:00", "lat": 35.0885, "lon": 126.1085, "category": "교회/순례"}, {"name": "정일품식당", "time": "12:00", "lat": 35.0892, "lon": 126.1094, "category": "식사"}, {"name": "짱뚱어해수욕장", "time": "14:00", "lat": 34.9913, "lon": 126.13, "category": "관광/체험"}, {"name": "보물섬식당 (보물섬길 8)", "time": "18:00", "lat": 35.0022446, "lon": 126.132898, "category": "식사"}, {"name": "증동리교회", "time": "19:00", "lat": 35.0113, "lon": 126.1363, "category": "교회/순례"}, {"name": "에버리스 U&I 펜션", "time": "20:30", "lat": 34.9838, "lon": 126.1352, "category": "숙소"}], "8/5 (수)": [{"name": "에버리스 U&I 펜션", "time": "08:00", "lat": 34.9838, "lon": 126.1352, "category": "숙소"}, {"name": "화도 노두길(화도 진입부)", "time": "09:30", "lat": 34.9587, "lon": 126.1608, "category": "관광/체험"}, {"name": "화도교회(에벤에셀 한옥카페 인근)", "time": "11:30", "lat": 34.9492, "lon": 126.1663, "category": "교회/순례"}, {"name": "동아회관", "time": "13:00", "lat": 35.2178, "lon": 126.3762, "category": "식사"}, {"name": "염산교회(위치 추정)", "time": "14:00", "lat": 35.2188, "lon": 126.3855, "category": "교회/순례"}, {"name": "양산 증산역(도착 기준)", "time": "21:00", "lat": 35.3088, "lon": 129.0098, "category": "출발/도착"}]};
const catColors = {"출발/도착": "#263238", "식사": "#F39C12", "교회/순례": "#4A90E2", "관광/체험": "#5CB85C", "숙소": "#7F8C8D", "프로그램": "#9B59B6"};
const segmentColors = ["#1565C0", "#00838F", "#2E7D32", "#827717", "#EF6C00", "#C62828", "#6A1B9A", "#6D4C41"];
const dayNames = Object.keys(data);

const map = L.map('map', {
  minZoom: 6,
  maxZoom: 15
});

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

let markerLayers = [];
let fallbackLines = [];
let routingControls = [];

function clearCurrentDay() {
  markerLayers.forEach(layer => map.removeLayer(layer));
  fallbackLines.forEach(layer => map.removeLayer(layer));
  routingControls.forEach(control => map.removeControl(control));
  markerLayers = [];
  fallbackLines = [];
  routingControls = [];
}

function renderDay(day) {
  clearCurrentDay();
  const stops = data[day];

  document.querySelectorAll('.tab').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.day === day);
  });

  document.getElementById('stopList').innerHTML = stops.map((s,i) =>
    `<li><b>${i+1}. ${s.name}</b><br><span>${s.time} · ${s.category}</span></li>`
  ).join('');

  document.getElementById('segmentLegend').innerHTML =
    '<div style="font-weight:700;font-size:13px;margin-bottom:6px">구간별 동선</div>' +
    stops.slice(0,-1).map((s,i) => {
      const color = segmentColors[i % segmentColors.length];
      const dashed = i === stops.length - 2;
      return `<div class="legend-row"><span class="swatch" style="background:${color}"></span><span>${i+1}구간 · ${s.name} → ${stops[i+1].name}${dashed ? ' · 점선' : ''}</span></div>`;
    }).join('');

  const bounds = [];

  stops.forEach((s,i) => {
    const bg = catColors[s.category] || '#455A64';
    const icon = L.divIcon({
      className:'',
      html:`<div class="num-pin" style="background:${bg}">${i+1}</div>`,
      iconSize:[32,32],
      iconAnchor:[16,16]
    });
    const marker = L.marker([s.lat,s.lon],{icon})
      .addTo(map)
      .bindPopup(`<b>${i+1}. ${s.name}</b><br>${s.time} · ${s.category}`);
    markerLayers.push(marker);
    bounds.push([s.lat,s.lon]);
  });

  stops.slice(0,-1).forEach((s,i) => {
    const next = stops[i+1];
    const color = segmentColors[i % segmentColors.length];
    const dashed = i === stops.length - 2;

    const fallback = L.polyline([[s.lat,s.lon],[next.lat,next.lon]], {
      color,
      weight:3,
      opacity:.35,
      dashArray:dashed ? '7,8' : null
    }).addTo(map);
    fallbackLines.push(fallback);

    const routing = L.Routing.control({
      waypoints:[L.latLng(s.lat,s.lon),L.latLng(next.lat,next.lon)],
      addWaypoints:false,
      draggableWaypoints:false,
      routeWhileDragging:false,
      fitSelectedRoutes:false,
      showAlternatives:false,
      createMarker:()=>null,
      lineOptions:{styles:[{
        color,
        weight:6,
        opacity:.9,
        dashArray:dashed ? '10,10' : null
      }]}
    }).addTo(map);
    routingControls.push(routing);
  });

  map.fitBounds(bounds, {padding:[50,50], maxZoom:10});
}

const tabs = document.getElementById('tabs');
dayNames.forEach((day,i) => {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'tab' + (i === 0 ? ' active' : '');
  btn.dataset.day = day;
  btn.textContent = day;
  btn.addEventListener('click', () => renderDay(day));
  tabs.appendChild(btn);
});

renderDay(dayNames[0]);
</script>
</body>
</html>
